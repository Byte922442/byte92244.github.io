<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Заявка на модерацию | Центр экрана</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #0f121c 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Карточка по центру */
        .glass-card {
            background: rgba(30, 34, 48, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(88, 101, 242, 0.2);
            max-width: 720px;
            width: 100%;
            padding: 2rem 2rem 2.5rem;
            transition: all 0.3s ease;
            margin: auto;
        }

        @media (max-width: 550px) {
            .glass-card {
                padding: 1.5rem;
            }
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            background: linear-gradient(135deg, #5865f2, #4752c4);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: white;
            text-transform: uppercase;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #b9c3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        /* Блок с авто-пингом */
        .auto-ping-info {
            background: linear-gradient(135deg, #1e2440, #151a30);
            border: 1px solid #5865f2;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .ping-icon {
            font-size: 1.8rem;
        }

        .ping-text {
            flex: 1;
        }

        .ping-text strong {
            color: #5865f2;
        }

        .ping-roles-list {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.3rem;
        }

        .role-tag {
            background: #2c2a55;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b9c3ff;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #eef2ff;
            font-size: 0.9rem;
        }

        .required-star {
            color: #ed4245;
            margin-left: 0.2rem;
        }

        input, textarea, select {
            background: #1e2436;
            border: 1.5px solid #2c3147;
            border-radius: 1rem;
            padding: 0.85rem 1.2rem;
            font-size: 1rem;
            color: #f0f3ff;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #5865f2;
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.3);
            background: #23293f;
        }

        textarea {
            min-height: 90px;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a3adcf' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: #1e2436;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            border: 1.5px solid #2c3147;
        }

        .radio-group label {
            margin-bottom: 0;
            font-weight: 500;
            gap: 0.4rem;
            cursor: pointer;
        }

        input[type="radio"] {
            accent-color: #5865f2;
            width: auto;
            margin-right: 0.3rem;
            transform: scale(1.05);
        }

        button {
            background: linear-gradient(95deg, #5865f2, #4752c4);
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 8px 18px rgba(88, 101, 242, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #6c78f2, #5865f2);
            box-shadow: 0 12px 22px rgba(88, 101, 242, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .toast-msg {
            visibility: hidden;
            min-width: 260px;
            background-color: #1e2436e6;
            backdrop-filter: blur(12px);
            color: #fff;
            text-align: center;
            border-radius: 60px;
            padding: 12px 24px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            border-left: 4px solid #23a55a;
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
            transition: visibility 0.2s, opacity 0.2s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-msg.show {
            visibility: visible;
            opacity: 1;
        }

        .toast-msg.error {
            border-left-color: #ed4245;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #2c3147, transparent);
            margin: 0.5rem 0 1.2rem;
        }

        /* Убрали footer с текстом */
    </style>
</head>
<body>

<div class="glass-card">
    <div class="header">
        <div class="badge">✨ Модерация Discord</div>
        <h1>Заявка на модерацию</h1>
    </div>

    <!-- Блок с авто-пингом -->
    <div class="auto-ping-info">
        <div class="ping-icon">🔔</div>
        <div class="ping-text">
            <strong>Автоматическое уведомление</strong><br>
            При отправке заявки <strong>всегда будут отмечены</strong> следующие роли:
            <div class="ping-roles-list">
                <span class="role-tag">🟢 JuniperBot</span>
                <span class="role-tag">🔴 СОЗДАТЕЛЬ</span>
                <span class="role-tag">🟡 ЗАМ</span>
            </div>
        </div>
    </div>

    <form id="modForm">
        <!-- 1. Ваш ник -->
        <div class="form-group">
            <label>1. Ваш ник <span class="required-star">*</span></label>
            <input type="text" id="nickname" placeholder="Введите ваш Discord / игровой ник" required>
        </div>

        <!-- 2. Почему хотите встать на должность -->
        <div class="form-group">
            <label>2. Почему вы хотите встать на эту должность? <span class="required-star">*</span></label>
            <textarea id="reason" placeholder="Опишите вашу мотивацию, видение работы и почему именно вы..." required></textarea>
        </div>

        <!-- 3. Опыт -->
        <div class="form-group">
            <label>3. Был ли у вас опыт? <span class="required-star">*</span></label>
            <textarea id="experience" placeholder="Если был опыт модерации/администрирования — расскажите. Если нет, так и напишите 'Опыта нет, но готов учиться'" required></textarea>
        </div>

        <!-- 4. Возраст -->
        <div class="form-group">
            <label>4. Ваш возраст <span class="required-star">*</span></label>
            <input type="number" id="age" placeholder="например: 19" min="13" max="100" required>
        </div>

        <!-- 5. Готовность к обзвону -->
        <div class="form-group">
            <label>5. Готовы ли вы пройти обзвон? <span class="required-star">*</span></label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="callReady" value="Да, полностью готов" required> ✅ Да, готов
                </label>
                <label>
                    <input type="radio" name="callReady" value="Нет, не готов"> ❌ Нет, не готов
                </label>
                <label>
                    <input type="radio" name="callReady" value="Возможно, обсуждаемо"> 🤔 Возможно
                </label>
            </div>
        </div>

        <!-- 6. Когда сможете пройти обзвон -->
        <div class="form-group">
            <label>6. Когда сможете пройти обзвон? <span class="required-star">*</span></label>
            <input type="text" id="callTime" placeholder="например: 25-26 мая после 18:00 МСК / в любое время" required>
        </div>

        <!-- Доп. контакт -->
        <div class="form-group">
            <label>Доп. контакт (опционально)</label>
            <input type="text" id="contact" placeholder="Telegram / Discord (если не совпадает с ником)">
        </div>

        <hr>
        <button type="submit" id="submitBtn">
            ✨ Отправить заявку (с пингом всех ролей)
        </button>
    </form>
</div>

<div id="toastMsg" class="toast-msg">✅ Заявка отправлена!</div>

<script>
    (function() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500027809047908392/Fz8EMr7v8F-JrRVOPQNPnHOq_ZUeb9-VIsX5d6MV_u9IH2v3dYRmER80yft93LqEdqfW";
        
        // ⚠️ ЗАМЕНИТЕ НА РЕАЛЬНЫЕ ID РОЛЕЙ
        const ROLE_IDS = {
            "🟢 JuniperBot": "1500024123957710848",
            "🔴 СОЗДАТЕЛЬ": "1500019319227158699",
            "🟡 ЗАМ": "1500019872766365827"
        };
        
        const form = document.getElementById('modForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toastMsg');
        
        const nicknameInput = document.getElementById('nickname');
        const reasonInput = document.getElementById('reason');
        const experienceInput = document.getElementById('experience');
        const ageInput = document.getElementById('age');
        const callTimeInput = document.getElementById('callTime');
        const contactInput = document.getElementById('contact');
        
        function showNotification(message, isError = false) {
            toast.textContent = message;
            if (isError) {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3800);
        }
        
        function escapeMarkdown(text) {
            if (!text) return "";
            return text.replace(/([`*_~|\\])/g, '\\$1')
                       .replace(/@(everyone|here)/gi, '@\u200b$1');
        }
        
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength - 3) + "...";
        }
        
        function getAllRolesMention() {
            const roleMentions = [];
            const roleNames = ["🟢 JuniperBot", "🔴 СОЗДАТЕЛЬ", "🟡 ЗАМ"];
            
            for (const roleName of roleNames) {
                const roleId = ROLE_IDS[roleName];
                if (roleId && !roleId.includes("ID_РОЛИ") && /^\d+$/.test(roleId)) {
                    roleMentions.push(`<@&${roleId}>`);
                } else {
                    roleMentions.push(`**${roleName}**`);
                }
            }
            
            return `🔔 **НОВАЯ ЗАЯВКА НА МОДЕРАЦИЮ**\nУведомление для модерации: ${roleMentions.join(" ")}`;
        }
        
        function validateForm() {
            const nickname = nicknameInput.value.trim();
            if (nickname === "") {
                showNotification("❌ Введите ваш ник!", true);
                nicknameInput.focus();
                return false;
            }
            if (nickname.length < 2) {
                showNotification("❌ Ник слишком короткий", true);
                return false;
            }
            
            const reason = reasonInput.value.trim();
            if (reason === "") {
                showNotification("❌ Расскажите, почему хотите стать модератором", true);
                reasonInput.focus();
                return false;
            }
            if (reason.length < 10) {
                showNotification("❌ Опишите мотивацию подробнее (минимум 10 символов)", true);
                return false;
            }
            
            const experience = experienceInput.value.trim();
            if (experience === "") {
                showNotification("❌ Укажите информацию об опыте", true);
                experienceInput.focus();
                return false;
            }
            
            const ageRaw = ageInput.value.trim();
            if (ageRaw === "") {
                showNotification("❌ Укажите ваш возраст", true);
                ageInput.focus();
                return false;
            }
            const ageNum = parseInt(ageRaw, 10);
            if (isNaN(ageNum) || ageNum < 13 || ageNum > 100) {
                showNotification("❌ Введите корректный возраст (от 13 до 100)", true);
                ageInput.focus();
                return false;
            }
            
            const callReadyRadios = document.querySelectorAll('input[name="callReady"]');
            let callReadySelected = false;
            let callReadyValue = "";
            for (let radio of callReadyRadios) {
                if (radio.checked) {
                    callReadySelected = true;
                    callReadyValue = radio.value;
                    break;
                }
            }
            if (!callReadySelected) {
                showNotification("❌ Выберите готовность к обзвону", true);
                return false;
            }
            
            const callTime = callTimeInput.value.trim();
            if (callTime === "") {
                showNotification("❌ Укажите, когда сможете пройти обзвон", true);
                callTimeInput.focus();
                return false;
            }
            
            return {
                nickname: escapeMarkdown(nickname),
                reason: escapeMarkdown(reason),
                experience: escapeMarkdown(experience),
                age: ageNum,
                callReady: callReadyValue,
                callTime: escapeMarkdown(callTime),
                contact: escapeMarkdown(contactInput.value.trim()) || "Не указан"
            };
        }
        
        async function sendToDiscord(formData) {
            const mentionContent = getAllRolesMention();
            
            const embed = {
                title: "📋 НОВАЯ ЗАЯВКА НА МОДЕРАЦИЮ",
                color: 0x5865F2,
                timestamp: new Date().toISOString(),
                footer: {
                    text: "Автоматический пинг ролей",
                    icon_url: "https://cdn.discordapp.com/emojis/891472270519590952.png"
                },
                fields: [
                    { name: "👤 Никнейм", value: formData.nickname, inline: false },
                    { name: "💡 Почему хочет встать на должность", value: truncateText(formData.reason, 950), inline: false },
                    { name: "📜 Опыт модерации", value: truncateText(formData.experience, 950), inline: false },
                    { name: "🎂 Возраст", value: `${formData.age} лет`, inline: true },
                    { name: "📞 Готов к обзвону?", value: formData.callReady, inline: true },
                    { name: "⏰ Когда сможет пройти обзвон", value: formData.callTime, inline: false },
                    { name: "📬 Доп. контакт", value: formData.contact, inline: false }
                ],
                thumbnail: { url: "https://cdn-icons-png.flaticon.com/512/5968/5968705.png" }
            };
            
            const payload = {
                username: "📝 Заявки на модерацию",
                avatar_url: "https://cdn.discordapp.com/attachments/922540726945316864/1084322121565933629/discord-mod.png",
                content: mentionContent,
                embeds: [embed]
            };
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    return { success: true };
                } else {
                    let errorText = await response.text();
                    return { success: false, error: `Ошибка ${response.status}` };
                }
            } catch (networkError) {
                return { success: false, error: "Ошибка сети" };
            }
        }
        
        function setLoadingState(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.style.opacity = "0.7";
                submitBtn.innerHTML = `<span>⏳ Отправка...</span>`;
            } else {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.innerHTML = `✨ Отправить заявку (с пингом всех ролей)`;
            }
        }
        
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const validated = validateForm();
            if (!validated) return;
            
            setLoadingState(true);
            const result = await sendToDiscord(validated);
            
            if (result.success) {
                showNotification("✅ Заявка отправлена! Модераторы уведомлены.");
                form.reset();
                document.querySelectorAll('input[name="callReady"]').forEach(radio => radio.checked = false);
            } else {
                showNotification(`❌ Ошибка: ${result.error}`, true);
            }
            
            setLoadingState(false);
        });
    })();
</script>
</body>
</html>
